services:
  - type: web
    name: jarvis
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_API_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
